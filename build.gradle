plugins {
    id 'java'
}

group = 'com.denor1999'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'io.appium:java-client:10.1.1'
    testImplementation 'com.codeborne:selenide:7.18.1'
    testImplementation 'org.aeonbits.owner:owner:1.0.12'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.slf4j:slf4j-simple:2.0.9'
}

tasks.withType(Test) {
    useJUnitPlatform()
    systemProperties(System.getProperties())
    def platform = System.getProperty('platform')
    if (platform) {
        filter {
            includeTestsMatching "*${platform.capitalize()}*"
        }
    }
    testLogging {
        lifecycle {
            events "started", "skipped", "failed", "standard-error", "standard-out"
            exceptionFormat "short"
        }
    }
}